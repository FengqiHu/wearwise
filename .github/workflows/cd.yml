name: CD

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy-frontend:
    name: Deploy Frontend to Firebase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: cd client && npm install

      - name: Build client
        run: cd client && npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_REDIRECT_URI: ${{ secrets.VITE_GOOGLE_REDIRECT_URI }}

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: wearwise-cs423
          entryPoint: client

  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: cd server && npm install

      - name: Build server
        run: cd server && npm run build

      - name: Trigger Render Deploy
        id: trigger
        run: |
          echo "Triggering deploy for service ${{ secrets.RENDER_SERVICE_ID }}..."
          deploy=$(curl -s -X POST \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "Deploy response: $deploy"
          deploy_id=$(echo "$deploy" | jq -r '.id')
          if [ -z "$deploy_id" ] || [ "$deploy_id" = "null" ]; then
            echo "Failed to get deploy ID from response"
            exit 1
          fi
          echo "deploy_id=$deploy_id" >> $GITHUB_OUTPUT
          echo "Deploy triggered with ID: $deploy_id"

      - name: Wait for Deploy to Complete
        run: |
          deploy_id="${{ steps.trigger.outputs.deploy_id }}"
          echo "Polling deploy status for ID: $deploy_id"
          for i in $(seq 1 60); do
            status=$(curl -s \
              "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys/$deploy_id" \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              | jq -r '.status')
            echo "[$i/60] Status: $status"
            if [ "$status" = "live" ]; then
              echo "Deploy succeeded!"
              exit 0
            elif [ "$status" = "deactivated" ] || [ "$status" = "build_failed" ] || [ "$status" = "update_failed" ] || [ "$status" = "canceled" ]; then
              echo "Deploy failed with status: $status"
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for deploy to complete"
          exit 1